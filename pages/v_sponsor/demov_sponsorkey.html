<style>
html, body {
    margin:0;
    padding:0;
    overflow: hidden !important;
}
body {
    position:relative;
}
#playerContainer {
	position: relative !important;
	width: 100% !important;
	padding-bottom: 56.25% !important;
	pointer-events: none !important;
	overflow: hidden !important;
    z-index:1;
}

#player {
    position: absolute !important;
	top: 0 !important;
	left: 0 !important;
	width: 100% !important;
	height: 100% !important;
	border: 0 !important;
	overflow: hidden !important;
    z-index:2;
}

.player-txt {
    display:block;
    position:absolute;
    bottom:20px;
    left:5%;
    right:5%;
    max-width:90%;
    margin:0 auto;
    text-align:center;
    z-index:4;
}

.player-txt .player-txt-inner {
    display:inline-block;
    font-weight:bold;
    padding:4px;
    font-size:16px;
    line-height:1.5;
    color:#fff;
    /* background-color:rgba(0,0,0,0.8); */
    text-shadow: 0px 0px 3px rgba(0,0,0,1);
}

#playerAudioContainer {
    position:absolute;
    top:20px;
    left:5%;
    right:5%;
    max-width:90%;
    z-index:3;
}

#playerAudio {
    z-index:4;
}
.playerAudio-txt {
    position:relative;
    display:block;
    margin:0 auto;
    text-align:center;
    z-index:5;
}
.playerAudio-txt .playerAudio-txt-inner {
    display:inline-block;
    font-weight:bold;
    padding:4px;
    font-size:16px;
    line-height:1.5;
    color:#fff;
    /* background-color:rgba(0,0,0,0.8); */
    text-shadow: 0px 0px 3px rgba(0,0,0,1);
}
.player-txt-inner .c-green,
.playerAudio-txt-inner .c-green {
    margin-left:3px;
    color:#00FFF6;
}
.player-txt-inner span:nth-child(1),
.playerAudio-txt-inner span:nth-child(1) {
    margin-right:3px;
}

</style>

</head>

        <!-- video -->
        <div id="player"></div>
        <div class="player-txt" style="display:none">
            <div class="player-txt-inner">
                <span>[영상후원]</span>
                <span class="c-green"  id="v_nick" ></span>
                님이<span class="c-green" id="v_lex"></span> 렉스로 후원해주셨습니다!
            </div>
        </div>

    </div>

    <!-- audio -->
    <div id="playerAudioContainer">
        <div id="playerAudio"></div>

        <div class="playerAudio-txt" style="display:none">
            <div class="playerAudio-txt-inner">
                <span>[음성후원]</span>
                <span class="c-green" id="a_nick"></span>
                님이 <span class="c-green" id="a_lex"></span> 렉스로 후원해주셨습니다!
            </div>
        </div>
    </div>
