    <style>
    /* roulette */
    .rouletteContainer {
        position:absolute;
        left:0;
        right:0;
        width:100%;
        bottom:10px;
        height:50px;
        overflow-y:hidden;
        display:flex;
        justify-content: center;
        align-items: center;
        z-index:1;
    }
    .roulette-area {
        width:400px;
        max-width:400px;
        height:50px;
        margin:0 auto;
    }
    .roulette-area .roulette .item {
        height:50px;
        padding:14px 0;
        text-align:center;
        font-weight:bold;
        color:#fbff00;
        text-shadow: rgb(0, 0, 0) 2px 0px 0px, rgb(0, 0, 0) 1.75517px 0.958851px 0px, rgb(0, 0, 0) 1.0806px 1.68294px 0px, rgb(0, 0, 0) 0.141474px 1.99499px 0px, rgb(0, 0, 0) -0.832294px 1.81859px 0px, rgb(0, 0, 0) -1.60229px 1.19694px 0px, rgb(0, 0, 0) -1.97998px 0.28224px 0px, rgb(0, 0, 0) -1.87291px -0.701566px 0px, rgb(0, 0, 0) -1.30729px -1.5136px 0px, rgb(0, 0, 0) -0.421592px -1.95506px 0px, rgb(0, 0, 0) 0.567324px -1.91785px 0px, rgb(0, 0, 0) 1.41734px -1.41108px 0px, rgb(0, 0, 0) 1.92034px -0.558831px;
    }

    /* .roulette-area .item.current {
    } */

    /* FLEXTV 이벤트 룰렛: 기존 룰렛 자리(알림 아래)에 룰렛 문구와 함께 뜬다 */
    .ev-roulette-layer {
        position:absolute;
        left:0;
        right:0;
        bottom:10px;
        z-index:2;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:8px;
        opacity:0;
        transform:translateY(10px);
        transition:opacity .3s, transform .3s;
        pointer-events:none;
    }
    .ev-roulette-layer.show { opacity:1; transform:none; }
    .ev-roulette-text {
        margin:0;
        padding:0 12px;
        font-family:"Black Han Sans", "Noto Sans KR", sans-serif;
        font-size:22px;
        color:#ffffff;
        text-align:center;
        text-shadow:-2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }
    .ev-roulette-box.is-banner { width:440px; max-width:96vw; height:76px; --evr-h:76px; }
    .ev-roulette-box.is-wheel { width:240px; height:218px; }

    </style>
