<body style="background-color:rgba(240, 6, 6, 0)">
<div id="popWinBox">
	<!-- 콘텐츠 삽입 Start -->

	<!-- 목표치 -->
	<!-- goal box start -->
	<div class="chat-box goal-box-area" style="background-color:rgba(240, 6, 6, 0)">
		<div class="goal-bar-area "  style=" visibility: hidden;">
			<div class="goal-box" style="height:40px">
				<p class="goal-tit">오늘의 후원 목표치</p>
				<div class="goal-bar">
					<div class="goal-inner animated" style="width: 75%;"></div>
				</div>
				<div class="txt start goal_start"><span class="value">0</span class="num"> 개</span></div>
				<div class="txt end goal_end"><span class="value">200</span class="num"> 개</span></div>
				<div class="inner-txt">50개 (25%)</div>
			</div>


           <!-- circle -->
		   <div
		   class="ldBar label-center ldCircle  t-gift"
		   style=" width:100%; height:100%;"
		   data-value="0"
		   data-stroke-width="4"
		   data-stroke-trail-width="4"
		   data-stroke="#ff0000"
		   data-min="0"
		   data-max="100"
		   >
			   <span class="pro-title" ></span>
		   </div>





		   <!-- heart -->
		   <div
		   class="ldBar label-center ldHeart t-gift"
		   style=" width:100%; height:100%;"
		   data-value="0"
		   data-stroke-width="4"
		   data-stroke-trail-width="4"
		   data-stroke="#ff0000"
		   data-min="0"
		   data-max="100"
		   >
		   <span class="pro-title"></span>
		   </div>



		   <!-- star -->
		   <div
		   class="ldBar label-center ldStar t-gift"
		   style="width:100%; height:100%;"
		   data-value="0"
		   data-stroke-width="2"
		   data-stroke-trail-width="2"
		   data-stroke="#ff0000"
		   data-min="0"
		   data-max="100"
		   >
		   <span class="pro-title"></span>
		   </div>



			 <!-- fan -->
			 <div
			 class="ldBar label-center ldFan t-gift"
			 style=" width:70%; height:70%; "
			 data-value="0"
			 data-stroke-width="4"
			 data-stroke-trail-width="4"
			 data-stroke="#ff0000"
			 data-min="0"
			 data-max="100"
			 >
			 <span class="pro-title"></span>
			 </div>









		</div>
	</div>
	<!-- //goal box End -->

	<!-- //콘텐츠 삽입 End -->
</div>

<script src="../win_target.js?202512291902"></script>
</body>
</html>
