    <style>

        #banner {
            opacity: 0;
        }
        .bannerImg {
            overflow: hidden;
            opacity: 0;
            transform: translateY(50px);
            animation: slideInOut 5s ease-in-out forwards;
        }

        @keyframes slideInOut {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            20% {
                opacity: 1;
                transform: translateY(0);
            }

            /* 20% ~ 80% (1초 ~ 4초): 3초 동안 화면에 정지 유지 */
            80% {
                opacity: 1;
                transform: translateY(0);
            }

            /* 80% ~ 100% (4초 ~ 5초): 퇴장 (Slide Down + Fade Out) */
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
